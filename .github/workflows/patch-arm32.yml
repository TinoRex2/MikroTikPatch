name: Patch RouterOS ARM32

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'RouterOS version (ej: 7.24.4). Vacío = última stable'
        required: false
        type: string
      mode_arm:
        description: 'Aplicar fixup mode_arm (necesario en 7.24.x)'
        required: true
        default: true
        type: boolean
      packages:
        description: 'Incluir all_packages y netinstall (+20-30 min)'
        required: true
        default: true
        type: boolean
      loader_only:
        description: 'Solo generar el loader (no reconstruir .npk)'
        required: true
        default: false
        type: boolean
      release:
        description: 'Crear una release en GitHub con los .npk'
        required: true
        default: false
        type: boolean

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools aria2 p7zip-full

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyelftools capstone unicorn pyzipper pefile

      - name: Resolve version
        id: resolve
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(wget -qO- "https://${{ secrets.MIKRO_UPGRADE_URL }}/routeros/NEWESTa7.stable" | cut -d' ' -f1)
          fi
          if [ -z "$V" ]; then
            echo "No se pudo resolver la version"
            exit 1
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Version: $V"

      # ------------------------------------------------------------------
      # CACHE de descargas (opción 1)
      # Guarda el .npk, all_packages-*.zip y netinstall-*.zip entre runs.
      # Si el cache acierta, el script detecta los ficheros y no re-descarga.
      # La key incluye la versión: cada versión tiene su propio cache.
      # ------------------------------------------------------------------
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            out-arm/routeros-${{ steps.resolve.outputs.version }}-arm.npk
            out-arm/all_packages-arm-${{ steps.resolve.outputs.version }}.zip
            out-arm/netinstall-${{ steps.resolve.outputs.version }}.zip
          key: downloads-${{ steps.resolve.outputs.version }}-arm-v1

      - name: Preflight - check keys
        env:
          MIKRO_LICENSE_PUBLIC_KEY: ${{ secrets.MIKRO_LICENSE_PUBLIC_KEY }}
          MIKRO_NPK_SIGN_PUBLIC_KEY: ${{ secrets.MIKRO_NPK_SIGN_PUBLIC_KEY }}
          CUSTOM_LICENSE_PUBLIC_KEY: ${{ secrets.CUSTOM_LICENSE_PUBLIC_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          CUSTOM_NPK_SIGN_PUBLIC_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PUBLIC_KEY }}
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
        run: |
          cd scripts
          python patch_loader_full_v2.py "${{ steps.resolve.outputs.version }}" arm --check-keys

      - name: Run patcher
        env:
          MIKRO_LICENSE_PUBLIC_KEY: ${{ secrets.MIKRO_LICENSE_PUBLIC_KEY }}
          MIKRO_NPK_SIGN_PUBLIC_KEY: ${{ secrets.MIKRO_NPK_SIGN_PUBLIC_KEY }}
          CUSTOM_LICENSE_PUBLIC_KEY: ${{ secrets.CUSTOM_LICENSE_PUBLIC_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          CUSTOM_NPK_SIGN_PUBLIC_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PUBLIC_KEY }}
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          MIKRO_LICENCE_URL: ${{ secrets.MIKRO_LICENCE_URL }}
          MIKRO_UPGRADE_URL: ${{ secrets.MIKRO_UPGRADE_URL }}
          MIKRO_CLOUD_URL: ${{ secrets.MIKRO_CLOUD_URL }}
          MODE_ARM_PASSWORD: ${{ secrets.MODE_ARM_PASSWORD }}
        run: |
          cd scripts
          ARGS="--payload self --download-threads 8 --force-kernel-version"

          # Opción 2: paquetes (all_packages + netinstall)
          if [ "${{ inputs.packages }}" != "true" ]; then
            ARGS="$ARGS --skip-all-packages --skip-netinstall"
          fi

          # Fixup mode_arm (7.24.x)
          if [ "${{ inputs.mode_arm }}" = "true" ]; then
            ARGS="$ARGS --mode-arm ../binaries/mode_arm.zip"
          fi

          # Solo loader
          if [ "${{ inputs.loader_only }}" = "true" ]; then
            ARGS="$ARGS --loader-only"
          fi

          echo "Argumentos: $ARGS"
          python patch_loader_full_v2.py \
            "${{ steps.resolve.outputs.version }}" arm \
            --output-dir ../out-arm \
            $ARGS

      - name: Show output
        if: always()
        run: |
          echo "=== Contenido de out-arm ==="
          ls -la out-arm/ 2>/dev/null || echo "no existe out-arm/"
          echo ""
          echo "=== Tamaño total ==="
          du -sh out-arm/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: routeros-arm32-${{ steps.resolve.outputs.version }}
          path: |
            out-arm/loader_parcheado
            out-arm/*FINAL*.npk
            out-arm/*-patched.zip
          if-no-files-found: warn
          compression-level: 6

      - name: Create release (mode_arm)
        if: ${{ inputs.release && inputs.mode_arm && success() }}
        uses: softprops/action-gh-release@v2
        with:
          name: "RouterOS ${{ steps.resolve.outputs.version }} arm (mode-arm)"
          tag_name: "${{ steps.resolve.outputs.version }}-arm"
          files: |
            out-arm/*FINAL-mode-arm.npk
            out-arm/*-patched.zip
          generate_release_notes: false

      - name: Create release (sin mode_arm)
        if: ${{ inputs.release && !inputs.mode_arm && success() }}
        uses: softprops/action-gh-release@v2
        with:
          name: "RouterOS ${{ steps.resolve.outputs.version }} arm"
          tag_name: "${{ steps.resolve.outputs.version }}-arm"
          files: |
            out-arm/routeros-${{ steps.resolve.outputs.version }}-arm-FINAL.npk
            out-arm/*-patched.zip
          generate_release_notes: false