name: Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-scripts:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyelftools capstone unicorn pyzipper

      - name: Show repo layout
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== scripts/ ==="
          ls -la scripts/
          echo "=== binaries/ ==="
          ls -la binaries/

      - name: Compile all Python files (syntax check)
        run: |
          cd scripts
          python -m compileall -q .
          echo "Sintaxis OK"

      - name: Import check
        run: |
          cd scripts
          python -c "import patch_loader_full_v2; print('import patch_loader_full_v2 OK')"
          python -c "import npk; print('import npk OK')"
          python -c "import mikro; print('import mikro OK')"

      - name: Show CLI help
        run: |
          cd scripts
          python patch_loader_full_v2.py --help | head -40
